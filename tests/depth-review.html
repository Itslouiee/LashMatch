<!doctype html><meta charset="utf-8"><base href="/Lash-Match-main-main/"><title>Depth fiber review</title><style>body{font:16px Arial;background:#fff8fa;margin:22px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{width:100%;border-radius:12px}h2{font-size:18px}p{line-height:1.5}</style><h1>Before / updated lash rendering</h1><p>Same synthetic eye, same manually supplied lid. This comparison does not test automatic eye detection.</p><p id="test-result">Loading</p><main></main><script src="lash-profiles.js"></script><script src="classic-asset-texture.js"></script><script>window.textureRenderer=ClassicLashAsset;</script><script src="classic-asset.js"></script><script src="lash-thumbnails.js"></script><script>
(async()=>{const photo=new Image();photo.src='assets/preview-eye.png';await photo.decode();await textureRenderer.ready;for(const style of ['Classic','Hybrid','DragLash (Mega Volume)'])for(const [label,renderer] of [['Before',textureRenderer],['Updated',ClassicLashAsset]]){const section=document.createElement('section'),title=document.createElement('h2'),c=document.createElement('canvas');title.textContent=style+' ? '+label;c.width=1000;c.height=540;section.append(title,c);document.querySelector('main').append(section);const ctx=c.getContext('2d');ctx.scale(1.25,1.25);ctx.translate(-380,-235);ctx.drawImage(photo,0,0);renderer.draw(ctx,LashThumbnails.eye,'right',LashThumbnails.point,1.4,()=>null,style);}document.getElementById('test-result').textContent='PASS: both renderers completed';})().catch(e=>document.getElementById('test-result').textContent='FAIL: '+e.message);
</script>
