<!doctype html><html><head><meta charset="utf-8"><title>All lash styles ? preview comparison</title><style>body{margin:24px;background:#fff8fa;color:#30242a;font:15px Arial}h1{font:30px Georgia}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}article{padding:10px;background:white;border:1px solid #efcbd7;border-radius:12px}img{width:100%;border-radius:8px}h2{font-size:17px;margin:8px 0}p{line-height:1.5}article p{font-size:13px;margin:0}#status{color:#8d3150}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><script src="../lash-profiles.js"></script><script src="../classic-asset.js"></script><script src="../lash-thumbnails.js"></script></head><body><h1>All active lash styles</h1><p>Same synthetic sample eye and renderer as Try On. Reference-based interpretations; salon-specific names can vary. This comparison tests rendering, not automatic eye detection.</p><p><a href="lash-style-references.html">View references and style notes</a></p><p id="status">Loading...</p><main class="grid"></main><script>
(async()=>{const {styles}=await fetch('../api.php?action=catalog').then(r=>r.json());let hashes=new Set();for(const s of styles){if(!LashStyleProfiles.resolve(s.name))throw Error('Missing profile: '+s.name);const article=document.createElement('article'),title=document.createElement('h2'),p=document.createElement('p');title.textContent=s.name;p.textContent=LashStyleProfiles.resolve(s.name).description;const img=LashThumbnails.image(s.name);article.append(img,title,p);document.querySelector('main').append(article);hashes.add(await LashThumbnails.source(s.name));}document.getElementById('status').textContent='PASS: '+styles.length+' active styles rendered; '+hashes.size+' distinct previews (Hybrid and Hybrid Lash intentionally share a pattern).';})().catch(e=>document.getElementById('status').textContent='FAIL: '+e.message);
</script></body></html>
